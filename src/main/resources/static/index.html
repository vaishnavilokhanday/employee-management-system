<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div>
                <h1>Employee Management System</h1>
                <p class="subtitle">Manage your departments efficiently</p>
            </div>
            <button class="btn btn-primary" onclick="openCreateModal()">
                + Add Department
            </button>
        </header>

        <!-- Toolbar -->
        <div class="toolbar">
            <input
                type="text"
                id="searchInput"
                class="search-input"
                placeholder="Search departments by name..."
                oninput="handleSearch(event)"
            />
            <button class="btn btn-secondary" onclick="loadDepartments()">
                🔄 Refresh
            </button>
        </div>

        <!-- Departments Table -->
        <div class="table-wrapper">
            <table class="departments-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Description</th>
                        <th>Created</th>
                        <th>Updated</th>
                        <th class="actions-col">Actions</th>
                    </tr>
                </thead>
                <tbody id="departmentsBody">
                    <tr>
                        <td colspan="6" class="empty-state">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal for Create/Edit -->
    <div id="modal" class="modal-overlay" onclick="closeModalOnOverlay(event)">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Add Department</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="departmentForm" onsubmit="handleSubmit(event)">
                <input type="hidden" id="departmentId" />

                <div class="form-group">
                    <label for="nameInput">Name *</label>
                    <input
                        type="text"
                        id="nameInput"
                        required
                        minlength="2"
                        maxlength="100"
                        placeholder="e.g., Engineering"
                    />
                </div>

                <div class="form-group">
                    <label for="descriptionInput">Description</label>
                    <textarea
                        id="descriptionInput"
                        maxlength="500"
                        rows="3"
                        placeholder="Optional description..."
                    ></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-primary">
                        Save
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>
